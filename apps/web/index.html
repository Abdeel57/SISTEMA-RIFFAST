<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- maximum-scale=1 evita el auto-zoom de iOS al enfocar campos (el pellizco para
         ampliar sigue funcionando desde iOS 10); interactive-widget hace que el teclado
         de Android redimensione el contenido en vez de tapar los campos. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#008B5A" />
    <meta name="description" content="Aparta tus boletos, paga fácil y recibe tu boleto digital con QR." />
    <!-- Open Graph / vista previa al compartir (WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rifas" />
    <meta property="og:title" content="Rifas y sorteos" />
    <meta property="og:description" content="Aparta tus boletos, paga fácil y recibe tu boleto digital con QR." />
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-default.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rifas" />
    <title>Rifas y sorteos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tipografías SIN bloquear el primer pintado (media=print → all al cargar):
         así la intro aparece al instante. La intro las espera (máx. ~1 s) antes de
         salir para que el texto no cambie de fuente a la vista (ver lib/intro.ts). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800;900&family=Archivo:wdth,wght@125,700..900&display=swap"
    />
    <link
      id="app-fonts"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800;900&family=Archivo:wdth,wght@125,700..900&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800;900&family=Archivo:wdth,wght@125,700..900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Intro de Riffast: el nombre se convierte en trébol mientras la app carga.
         El div con estilo en línea tapa la página desde el primer pintado; la app
         la suelta con ready() cuando ya hay contenido (ver src/lib/intro.ts). -->
    <div id="riffast-intro" style="position:fixed;inset:0;z-index:9999;background:#008B5A"></div>
    <script src="/riffast-intro.js"></script>
    <script>
      (function () {
        var root = document.documentElement, done = false;
        document.addEventListener('riffast-intro:done', function () { done = true; }, { once: true });
        // Red de seguridad: pase lo que pase, la página nunca se queda tapada.
        function release() {
          if (done) return;
          done = true;
          var el = document.getElementById('riffast-intro');
          if (el && el.parentNode) el.parentNode.removeChild(el);
          root.classList.remove('riffast-intro-active');
        }
        // Solo cuenta el tiempo con la pestaña visible (en segundo plano la intro se pausa sola).
        var budget = 9000, last = Date.now();
        document.addEventListener('visibilitychange', function () { last = Date.now(); });
        (function watch() {
          if (done) return;
          var now = Date.now();
          if (!document.hidden) budget -= now - last;
          last = now;
          if (budget <= 0) release(); else setTimeout(watch, 500);
        })();
        // Opciones únicas de la intro (src/lib/intro.ts las reutiliza al volver a
        // reproducirla). Se adapta a la carga real:
        //   - speed 1.15: ritmo base, por si la conexión es lenta (forma el trébol en ~1 s).
        //   - rush 2: si la app ya está lista, el resto corre al doble (~2.3×).
        //   - minTime 1.26: sale en cuanto el trébol termina de formarse.
        //   - maxWait 6: nunca tapa más de 6 s.
        window.__riffastIntroOptions = {
          ink: '#FFFFFF', autoReady: false, speed: 1.15, rush: 2, minTime: 1.26, maxWait: 6
        };
        try {
          window.__riffastIntro = window.RiffastIntro.mount(
            Object.assign({ container: '#riffast-intro' }, window.__riffastIntroOptions)
          );
        } catch (e) { release(); }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
