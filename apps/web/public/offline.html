<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03120C" />
    <title>Sin conexión — Riffast</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; background: #03120C; color: #fff; display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
      .card { max-width: 360px; }
      .logo { display: block; width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #97ACA1; line-height: 1.5; }
      button { margin-top: 20px; background: #10C65F; color: #03120C; border: 0; padding: 12px 24px; border-radius: 999px; font-weight: 600; font-size: 16px; }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- icon.svg queda en la precaché del service worker, así que carga sin red. -->
      <img class="logo" src="/icon.svg" alt="Riffast" />
      <h1>Sin conexión</h1>
      <p>No pudimos conectarte a internet. Revisa tu conexión e inténtalo de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
